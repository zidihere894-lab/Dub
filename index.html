<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIDDI AI STUDIO - Full Version</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #05070a; --card: #11141d; --gold: #ffcc00; --neon: #00ff41; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: 'Poppins', sans-serif; margin: 0; overflow-x: hidden; }

        .header { text-align: center; padding: 60px 20px; background: radial-gradient(circle, #1a1e29 0%, #05070a 100%); }
        .header h1 { color: var(--gold); letter-spacing: 8px; margin: 0; font-size: 42px; text-transform: uppercase; text-shadow: 0 0 20px rgba(255, 204, 0, 0.4); }
        .header p { color: #888; font-size: 16px; margin-top: 15px; letter-spacing: 1px; }

        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }

        /* Pricing Section */
        .pricing-section { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; margin-bottom: 60px; }
        .plan-card { 
            background: var(--card); border: 1px solid #222; border-radius: 30px; padding: 40px 30px; 
            text-align: center; transition: 0.4s; position: relative; display: flex; flex-direction: column;
        }
        .plan-card:hover { transform: translateY(-10px); border-color: var(--gold); }
        .plan-card h2 { color: var(--gold); font-size: 24px; margin:0; }
        .price { font-size: 40px; font-weight: 800; margin: 20px 0; }
        .price span { font-size: 14px; color: #555; }
        .plan-card ul { list-style: none; padding: 0; text-align: left; flex-grow: 1; }
        .plan-card ul li { margin-bottom: 10px; font-size: 14px; color: #bbb; }
        .plan-card ul li::before { content: '✦ '; color: var(--gold); }

        .btn-buy { border: 2px solid var(--gold); color: var(--gold); padding: 12px; border-radius: 12px; text-decoration: none; font-weight: bold; transition: 0.3s; margin-top: 20px; }
        .btn-buy:hover { background: var(--gold); color: #000; }

        /* Login & Tool UI */
        #login-section, #main-tool { max-width: 450px; margin: 0 auto; background: var(--card); padding: 40px; border-radius: 30px; border: 1px solid #333; box-shadow: 0 30px 60px rgba(0,0,0,0.5); }
        #main-tool { max-width: 800px; display: none; }
        
        input, select { width: 100%; padding: 15px; background: #080a0f; border: 1px solid #333; color: #fff; border-radius: 12px; margin-bottom: 20px; box-sizing: border-box; }
        .btn-action { width: 100%; padding: 18px; background: var(--gold); border: none; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.3s; color: #000; }
        .btn-action:hover { letter-spacing: 1px; transform: scale(1.01); }

        @media (max-width: 992px) { .pricing-section { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="ui-title">ZIDDI AI STUDIO</h1>
        <p id="ui-subtitle">Revolutionizing Japanese to Hindi AI Dubbing</p>
    </div>

    <div class="container">
        <div id="pricing-ui" class="pricing-section">
            <div class="plan-card" id="card-free">
                <h2>FREE</h2>
                <div class="price">$<span id="p-price-free">0</span><span>/mo</span></div>
                <ul id="p-feat-free"></ul>
                <a href="#" id="p-link-free" class="btn-buy text-center">Get Started</a>
            </div>
            <div class="plan-card" id="card-standard" style="border: 2px solid var(--gold);">
                <h2>STANDARD</h2>
                <div class="price">$<span id="p-price-standard">19</span><span>/mo</span></div>
                <ul id="p-feat-standard"></ul>
                <a href="#" id="p-link-standard" class="btn-buy text-center">Upgrade Now</a>
            </div>
            <div class="plan-card" id="card-premium">
                <h2>PREMIUM</h2>
                <div class="price">$<span id="p-price-premium">49</span><span>/mo</span></div>
                <ul id="p-feat-premium"></ul>
                <a href="#" id="p-link-premium" class="btn-buy text-center">Go Pro</a>
            </div>
        </div>

        <div id="login-section">
            <h2 style="text-align:center; margin-bottom:30px; color:var(--gold)">ACCESS STUDIO</h2>
            <input type="email" id="email" placeholder="Gmail Address">
            <input type="password" id="pass" placeholder="Password">
            <button class="btn-action" onclick="login()">LOGIN TO ENGINE</button>
        </div>

        <div id="main-tool">
            <div style="display:flex; justify-content:space-between; margin-bottom:30px; font-size: 14px;">
                <span>User: <b id="u-mail" style="color:var(--gold)"></b></span>
                <span>Plan: <b id="u-plan" style="color:var(--neon)"></b></span>
            </div>
            <div style="text-align:center; border: 2px dashed #333; padding:40px; border-radius:25px; background: #0c1018;">
                <span style="font-size:50px;">🎬</span>
                <h3>AI Studio Engine</h3>
                <p>Allowed Duration: <span id="u-limit" style="color:var(--gold)">0</span> Minutes</p>
                
                <input type="text" id="videoUrl" placeholder="Paste Japanese Video MP4 Link" style="border-color: #444;">
                
                <label style="display:block; text-align:left; font-size:12px; color:var(--gold); margin-bottom:5px;">Target Language</label>
                <select id="toLang"></select>

                <button id="dubBtn" class="btn-action" style="background:var(--neon)" onclick="startDubbing()">
                    🚀 START DUBBING
                </button>
                <div id="status-msg" style="margin-top:15px; font-size:13px; color:var(--gold)"></div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCFy28nNtxhkjfpOd0aCfYkjHUwErh1WVQ",
            authDomain: "movie-1e6fc.firebaseapp.com",
            projectId: "movie-1e6fc",
            databaseURL: "https://movie-1e6fc-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. Sync UI & Plans
        db.ref('settings/ui').on('value', s => {
            const d = s.val();
            if(d) {
                document.getElementById('ui-title').innerText = d.title;
                document.getElementById('ui-subtitle').innerText = d.subtitle;
            }
        });

        db.ref('settings/plans').on('value', snap => {
            snap.forEach(child => {
                const key = child.key;
                const data = child.val();
                if(document.getElementById(`p-price-${key}`)) {
                    document.getElementById(`p-price-${key}`).innerText = data.price;
                    document.getElementById(`p-link-${key}`).href = data.link;
                    const list = document.getElementById(`p-feat-${key}`);
                    list.innerHTML = '';
                    if(data.features) {
                        data.features.split(',').forEach(f => { list.innerHTML += `<li>${f.trim()}</li>`; });
                    }
                }
            });
        });

        db.ref('settings/languages').on('value', s => {
            const sel = document.getElementById('toLang'); sel.innerHTML = '';
            s.forEach(c => { sel.innerHTML += `<option value="${c.val()}">${c.val()}</option>`; });
        });

        // 2. Login Logic
        function login() {
            const emailIn = document.getElementById('email').value.toLowerCase().replace(/\./g, '_');
            const passIn = document.getElementById('pass').value;
            db.ref('users/' + emailIn).once('value', snap => {
                const u = snap.val();
                if(u && u.pass === passIn) {
                    document.getElementById('pricing-ui').style.display = 'none';
                    document.getElementById('login-section').style.display = 'none';
                    document.getElementById('main-tool').style.display = 'block';
                    document.getElementById('u-mail').innerText = u.email;
                    document.getElementById('u-plan').innerText = u.plan.toUpperCase();
                    db.ref('settings/plans/' + u.plan).once('value', p => {
                        document.getElementById('u-limit').innerText = p.val().limit;
                    });
                } else { alert("Access Denied! Check Credentials."); }
            });
        }

        // 3. Dubbing Logic (Plans ke saath)
        function startDubbing() {
            const url = document.getElementById('videoUrl').value;
            const lang = document.getElementById('toLang').value;
            const btn = document.getElementById('dubBtn');
            const msg = document.getElementById('status-msg');

            if(!url) return alert("Please enter video link!");

            btn.disabled = true;
            btn.innerText = "SINCING WITH ENGINE...";
            msg.innerText = "Verifying plan limits and sending task...";

            const taskId = "task_" + Date.now();
            db.ref('tasks/' + taskId).set({
                video_url: url,
                target_lang: lang,
                status: "pending",
                user: document.getElementById('u-mail').innerText,
                plan: document.getElementById('u-plan').innerText,
                timestamp: Date.now()
            }).then(() => {
                msg.innerHTML = "✅ SENT! Engine started. Check <b>Telegram</b> shortly.";
                btn.disabled = false;
                btn.innerText = "START DUBBING";
                document.getElementById('videoUrl').value = "";
            });
        }
    </script>
</body>
</html>

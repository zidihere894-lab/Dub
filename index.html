<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIDDI AI STUDIO - Official</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #05070a; --card: #11141d; --gold: #ffcc00; --neon: #00ff41; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: 'Poppins', sans-serif; margin: 0; }
        .header { text-align: center; padding: 50px 20px; background: radial-gradient(circle, #1a1e29 0%, #05070a 100%); }
        .header h1 { color: var(--gold); letter-spacing: 5px; font-size: 35px; text-transform: uppercase; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .pricing-section { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
        .plan-card { background: var(--card); border: 1px solid #222; border-radius: 25px; padding: 30px; text-align: center; }
        .price { font-size: 35px; font-weight: 800; color: var(--gold); }
        #login-section, #main-tool { max-width: 450px; margin: 0 auto; background: var(--card); padding: 35px; border-radius: 25px; border: 1px solid #333; }
        #main-tool { max-width: 700px; display: none; }
        input, select { width: 100%; padding: 14px; background: #080a0f; border: 1px solid #333; color: #fff; border-radius: 10px; margin-bottom: 15px; box-sizing: border-box; }
        .btn-action { width: 100%; padding: 16px; background: var(--gold); border: none; border-radius: 10px; font-weight: 800; cursor: pointer; color: #000; }
        #status-box { margin-top: 20px; padding: 15px; border-radius: 10px; background: rgba(0,255,65,0.05); border: 1px solid #111; display: none; }
        @media (max-width: 800px) { .pricing-section { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="ui-title">ZIDDI AI STUDIO</h1>
        <p id="ui-subtitle">Premium Japanese to Hindi Dubbing</p>
    </div>

    <div class="container">
        <div id="pricing-ui" class="pricing-section">
            <div class="plan-card"><h2>FREE</h2><div class="price">$0</div><ul id="p-feat-free"></ul></div>
            <div class="plan-card" style="border-color:var(--gold)"><h2>STANDARD</h2><div class="price">$19</div><ul id="p-feat-standard"></ul></div>
            <div class="plan-card"><h2>PREMIUM</h2><div class="price">$49</div><ul id="p-feat-premium"></ul></div>
        </div>

        <div id="login-section">
            <h2 style="text-align:center; color:var(--gold)">LOGIN</h2>
            <input type="email" id="email" placeholder="Gmail">
            <input type="password" id="pass" placeholder="Password">
            <button class="btn-action" onclick="login()">ENTER STUDIO</button>
        </div>

        <div id="main-tool">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <span id="u-mail"></span> <span id="u-plan" style="color:var(--neon)"></span>
            </div>
            <div style="text-align:center;">
                <p>Limit: <b id="u-limit"></b> Minutes</p>
                <input type="text" id="videoUrl" placeholder="Paste Direct MP4 Link">
                <select id="toLang"><option value="hi">Hindi</option></select>
                <button id="dubBtn" class="btn-action" style="background:var(--neon)" onclick="startDubbing()">START DUBBING</button>
                
                <div id="status-box">
                    <p style="margin:0; font-size:12px; color:#888;">ENGINE STATUS:</p>
                    <div id="live-status" style="color:var(--gold); font-weight:bold; font-size:18px; margin-top:5px;">Waiting...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCFy28nNtxhkjfpOd0aCfYkjHUwErh1WVQ",
            authDomain: "movie-1e6fc.firebaseapp.com",
            projectId: "movie-1e6fc",
            databaseURL: "https://movie-1e6fc-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Sync Plans
        db.ref('settings/plans').on('value', snap => {
            snap.forEach(c => {
                const list = document.getElementById(`p-feat-${c.key}`);
                if(list && c.val().features) {
                    list.innerHTML = '';
                    c.val().features.split(',').forEach(f => { list.innerHTML += `<li>${f}</li>`; });
                }
            });
        });

        function login() {
            const emailIn = document.getElementById('email').value.toLowerCase().replace(/\./g, '_');
            const passIn = document.getElementById('pass').value;
            db.ref('users/' + emailIn).once('value', snap => {
                const u = snap.val();
                if(u && u.pass === passIn) {
                    document.getElementById('pricing-ui').style.display = 'none';
                    document.getElementById('login-section').style.display = 'none';
                    document.getElementById('main-tool').style.display = 'block';
                    document.getElementById('u-mail').innerText = u.email;
                    document.getElementById('u-plan').innerText = u.plan.toUpperCase();
                    db.ref('settings/plans/' + u.plan).once('value', p => { document.getElementById('u-limit').innerText = p.val().limit; });
                } else { alert("Wrong Credentials!"); }
            });
        }

        function startDubbing() {
            const url = document.getElementById('videoUrl').value;
            if(!url) return alert("Link please!");
            
            const taskId = "task_" + Date.now();
            document.getElementById('status-box').style.display = 'block';
            document.getElementById('dubBtn').disabled = true;

            db.ref('tasks/' + taskId).set({
                video_url: url,
                status: "Waiting for Engine...",
                timestamp: Date.now()
            });

            // LIVE TRACKING
            db.ref('tasks/' + taskId + '/status').on('value', s => {
                const status = s.val();
                document.getElementById('live-status').innerText = status;
                if(status === 'completed') {
                    document.getElementById('live-status').innerHTML = "✅ DONE! Check Telegram.";
                    document.getElementById('dubBtn').disabled = false;
                }
            });
        }
    </script>
</body>
</html>
